name: Rust CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      regenerate_lockfile:
        description: Regenerate Cargo.lock and upload it as an artifact
        required: false
        default: false
        type: boolean
      build_windows_binary:
        description: Build unstruct.exe and upload it for local testing
        required: false
        default: false
        type: boolean
      build_release_artifacts:
        description: Build all release targets without publishing a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --locked --all-targets
      - name: Run tests
        run: cargo test --locked --all-targets --verbose
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  lockfile:
    name: Regenerate lockfile
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Update dependencies
        run: cargo update
      - name: Verify atty was removed
        run: '! grep -q ''name = "atty"'' Cargo.lock'
      - name: Test the updated lockfile
        run: cargo test --locked --all-targets --verbose
      - name: Show dependency changes
        run: git diff -- Cargo.lock
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  windows-dev-build:
    name: Build Windows development binary
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_binary
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --verbose
      - name: Upload unstruct.exe
        uses: actions/upload-artifact@v4
        with:
          name: unstruct-windows-${{ github.sha }}
          path: target/release/unstruct.exe
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release_artifacts)
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NAME: unstruct
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust target
        run: rustup target add "$TARGET"
      - name: Build release binary
        run: cargo build --locked --release --verbose --target "$TARGET"
      - name: Package release binary
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="$NAME.exe"
          else
            executable="$NAME"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$GITHUB_SHA"
          fi
          mkdir -p artifacts
          tar -czf "artifacts/$NAME-$TARGET-$version.tar.gz" \
            -C "target/$TARGET/release" "$executable"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: unstruct-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unstruct-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz