[package]
name = "unstruct"
version = "0.2.0"
edition = "2021"
description = "Convert batches of XML documents into tab-separated relational data"
repository = "https://github.com/Roenbaeck/unstruct"
license = "MIT"
readme = "README.md"

[dependencies]
roxmltree = "0.21"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
glob = "0.3"
pest = "2.9"
pest_derive = "2.9"
tempfile = "3.27"
